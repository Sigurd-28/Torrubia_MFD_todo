<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do App</title>
</head>
<body>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    <form class="form-inline my-2 my-lg-0" method="POST">
        {% csrf_token %}
        <input class="form-control mr-sm-2" type="search" placeholder="Add to list..." aria-label="Search" name="item">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Add to List</button>
    </form>
</body>
</html>
